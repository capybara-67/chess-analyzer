name: Check analyzer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python analyzer.py sample_game.pgn --depth 1 --format json
